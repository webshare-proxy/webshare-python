[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webshare-sdk"
version = "0.1.0"
description = "Official Python SDK for the Webshare proxy API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Webshare" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]
keywords = ["webshare", "proxy", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/webshare-proxy/webshare-python"
Repository = "https://github.com/webshare-proxy/webshare-python"
Documentation = "https://apidocs.webshare.io"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webshare"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "DESIGN.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.10"
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF"]
ignore = [
    # Model modules intentionally mirror long API field descriptions.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Wire field names use API grammar (e.g. `country_code__in`); keep them verbatim.
"tests/*" = ["RUF012"]
